<!doctype html><html lang="en"><meta charset="utf-8"><title>Wireflow preview checks</title><style>body{font:16px -apple-system,sans-serif;margin:24px;color:#24373e}button{padding:12px 18px;font-size:16px}iframe{width:375px;height:667px;border:1px solid #ddd;margin-top:20px}pre{white-space:pre-wrap;font-size:13px}</style><h1>Wireflow preview checks</h1><button id="run">Check all screen steps</button><p id="status" role="status">Ready</p><iframe id="preview" title="Screen under test"></iframe><pre id="results"></pre><script src="wireflows-data.js?v=35"></script><script>
const nodes=[];wireflows.forEach(f=>{const visit=n=>{nodes.push({flow:f.id,...n});n.children.forEach(visit);};visit(f.root);});
const until=(fn,timeout=6000)=>new Promise((resolve,reject)=>{const start=Date.now();function check(){try{if(fn())return resolve();}catch{}if(Date.now()-start>timeout)return reject(new Error('Preview did not become ready'));setTimeout(check,30);}check();});
document.getElementById('run').onclick=async()=>{const button=document.getElementById('run'),frame=document.getElementById('preview'),results=[];button.disabled=true;for(const n of nodes){document.getElementById('status').textContent=results.length+' / '+nodes.length+' · '+n.title;const fixture=n.fixture||'wire',query=new URLSearchParams({flow:fixture,audit:'1',embed:'1',v:'check37',step:n.id}),hash=n.source?'audit/'+encodeURIComponent(n.source):n.route;const previousDocument=frame.contentDocument;frame.src='index.html?'+query+'#'+hash;try{await until(()=>frame.contentDocument!==previousDocument&&frame.contentDocument?.readyState==='complete'&&frame.contentDocument?.documentElement.classList.contains('flow-embed')&&frame.contentDocument.querySelector('#app main')&&(n.source?frame.contentDocument.querySelector('#app').dataset.sourceState===n.source:frame.contentWindow.location.hash.slice(1)===hash));const doc=frame.contentDocument,main=doc.querySelector('#app main'),errors=[];if(['choose-role-form','student-id-form'].some(id=>doc.getElementById(id)&&!doc.getElementById(id).classList.contains('live-auth')))errors.push('legacy auth renderer overlays screenshot text');if(main.scrollWidth>main.clientWidth+1)errors.push('horizontal overflow');if(doc.querySelectorAll('#app header').length>1)errors.push('duplicate header');if(fixture==='cart'&&doc.querySelectorAll('.store-cart-line').length!==2)errors.push('cart fixture missing');if(fixture==='checkout'&&!doc.querySelector('#store-checkout-form'))errors.push('checkout fixture missing');if(fixture==='order'&&!doc.querySelector('.store-order-confirmation'))errors.push('order fixture missing');if(fixture==='pin-error'&&!doc.querySelector('#confirmation-error'))errors.push('PIN error fixture missing');if(fixture==='coupon'&&doc.querySelector('#dialog').hidden)errors.push('coupon dialog missing');results.push({flow:n.flow,id:n.id,title:n.title,pass:errors.length===0,errors,actualTitle:doc.title});}catch(e){results.push({flow:n.flow,id:n.id,pass:false,errors:[e.message]});}}document.getElementById('results').textContent=JSON.stringify(results,null,2);document.getElementById('status').textContent='Finished · '+results.length+' previews · '+results.filter(r=>!r.pass).length+' failures';button.disabled=false;};
</script></html>
