<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Looped In — screen audit</title><style>*{box-sizing:border-box}body{margin:0;color:#35464d;background:#edf0f0;font:13px -apple-system,BlinkMacSystemFont,sans-serif}nav{display:flex;gap:12px;align-items:center;padding:12px 18px;background:white;position:sticky;top:0;z-index:1}nav a{color:#087f95}input,select{font:inherit;border:1px solid #ccd7d9;padding:8px;border-radius:5px}input{max-width:220px}.layout{display:grid;grid-template-columns:235px 1fr}aside{max-height:calc(100svh - 60px);overflow:auto;padding:15px}aside a{display:block;color:#52646c;padding:6px 8px;text-decoration:none;border-radius:4px;font-size:12px}aside a.active{background:#087f95;color:white}aside h3{font-size:12px;margin:14px 8px 4px}.comparison{padding:12px 20px}.heading{display:flex;justify-content:space-between;gap:14px;align-items:center}.heading h1{font-size:18px;font-weight:500}.panes{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}.pane h2{font-size:12px;color:#788a91;font-weight:400;text-align:center}.source{height:790px;overflow:auto;background:#dfe5e7;text-align:center;padding:20px}.source img{display:block;width:375px;max-width:100%;height:auto;margin:auto}iframe{width:100%;height:840px;border:0}.notes{font-size:12px;color:#73868d;max-width:800px}.kind{color:#087f95;font-size:12px}.summary{font-size:12px;color:#7b8b92}#status{color:#087f95}@media(max-width:1000px){.layout{grid-template-columns:180px 1fr}.panes{grid-template-columns:1fr}.source{height:auto;max-height:700px}}@media(max-width:550px){.layout{display:block}aside{max-height:180px}.comparison{padding:12px}nav{flex-wrap:wrap}}</style></head><body><nav><a href="index.html">Looped In</a><input id="q" type="search" aria-label="Find source screen" placeholder="Find source screen"><select id="group" aria-label="Screen group"><option value="">All groups</option></select><span class="summary" id="summary"></span><span id="status"></span></nav><div class="layout"><aside></aside><section class="comparison"><div class="heading"><h1 id="title"></h1><span class="kind" id="kind"></span></div><p class="notes" id="notes"></p><div class="panes"><div class="pane"><h2>Original source</h2><div class="source"><img id="original" alt=""></div></div><div class="pane"><h2>Interactive reconstruction</h2><iframe title="Interactive prototype" id="live"></iframe></div></div></section></div><script>
let specs={},results={};fetch('screen-audit.json').then(r=>r.json()).then(d=>{specs=d;for(const g of new Set(Object.values(d).map(s=>s.group))){const o=document.createElement('option');o.value=g;o.textContent=g;document.querySelector('#group').append(o)}document.querySelector('#summary').textContent=Object.keys(d).length+' source states · '+Object.values(d).filter(s=>s.kind==='blank-source').length+' blank originals';render();select(decodeURIComponent(location.hash.slice(1))||'onboarding-01')});fetch('audit-results.json').then(r=>r.ok?r.json():[]).then(d=>{results=Object.fromEntries(d.map(r=>[r.id,r]));if(location.hash)select(decodeURIComponent(location.hash.slice(1)))}).catch(()=>{});function render(){const aside=document.querySelector('aside'),q=document.querySelector('#q').value.toLowerCase(),g=document.querySelector('#group').value;aside.replaceChildren();let last='';for(const [id,s] of Object.entries(specs).filter(([id,s])=>(!g||s.group===g)&&id.toLowerCase().includes(q))){if(s.group!==last){const h=document.createElement('h3');h.textContent=s.group;aside.append(h);last=s.group}const a=document.createElement('a');a.href='#'+encodeURIComponent(id);a.textContent=id;a.dataset.id=id;aside.append(a)}}function select(id){const s=specs[id];if(!s)return;document.querySelector('#title').textContent=id;document.querySelector('#kind').textContent=s.kind;document.querySelector('#notes').textContent=s.notes.join(' ');document.querySelector('#original').src=s.source;document.querySelector('#original').alt=id;document.querySelector('#live').src='index.html?audit=1#audit/'+encodeURIComponent(id);document.querySelectorAll('aside a').forEach(a=>a.classList.toggle('active',a.dataset.id===id));const r=results[id];document.querySelector('#status').textContent=r?(r.pass?'Render checked':'Needs review'):''}window.onhashchange=()=>select(decodeURIComponent(location.hash.slice(1)));document.querySelector('#q').oninput=render;document.querySelector('#group').onchange=render;
</script></body></html>
