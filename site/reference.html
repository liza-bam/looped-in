<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Looped In — original screens</title><style>*{box-sizing:border-box}body{margin:0;background:#e5e9e9;font:14px Arial;color:#394347}nav{background:white;padding:16px;display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:1}input,select,button,a{font:inherit;padding:9px;border:1px solid #cbd5d8;border-radius:4px;background:white;color:#087f95}input{flex:1}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:20px;padding:24px}figure{margin:0}figure img{width:100%;display:block;cursor:zoom-in}figcaption{padding:9px 0;font-size:12px}dialog{border:0;background:#e5e9e9;padding:12px;max-width:96vw;max-height:96vh}dialog img{display:block;max-width:90vw;max-height:86vh}dialog button{display:block;margin:10px auto 0;cursor:pointer}</style></head><body><nav><a href="index.html">Looped In</a><input id="q" type="search" aria-label="Find original screen"><select id="group" aria-label="Screen group"><option value="">All screens</option></select></nav><main></main><dialog><img alt=""><button>Close</button></dialog><script>let all=[];fetch('screens.json').then(r=>r.json()).then(d=>{all=d;for(const g of new Set(d.map(s=>s.group))){const o=document.createElement('option');o.value=g;o.textContent=g;document.querySelector('select').append(o)}render()});function render(){const q=document.querySelector('input').value.toLowerCase(),g=document.querySelector('select').value,m=document.querySelector('main');m.replaceChildren();for(const s of all.filter(s=>(!g||s.group===g)&&s.title.toLowerCase().includes(q))){const f=document.createElement('figure'),i=document.createElement('img'),c=document.createElement('figcaption');i.src=s.file;i.alt=s.title;i.loading='lazy';i.onclick=()=>{const d=document.querySelector('dialog');d.querySelector('img').src=s.file;d.querySelector('img').alt=s.title;d.showModal()};c.textContent=s.title;f.append(i,c);m.append(f)}}document.querySelector('input').oninput=render;document.querySelector('select').onchange=render;document.querySelector('dialog button').onclick=()=>document.querySelector('dialog').close();</script></body></html>
